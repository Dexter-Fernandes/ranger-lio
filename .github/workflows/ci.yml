name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image contains GTSAM and small_gicp built from source (about an hour).
      # GHA layer cache makes every later run skip that stage.
      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: ranger-lio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure, build, test
        run: |
          docker run --rm -v "$PWD":/workspaces/ranger-lio -w /workspaces/ranger-lio \
            -u "$(id -u):$(id -g)" -e HOME=/tmp ranger-lio:ci \
            bash -lc 'source /opt/ros/jazzy/setup.bash \
                      && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                      && cmake --build build \
                      && ctest --test-dir build --output-on-failure \
                      && ./build/apps/check_deps'
